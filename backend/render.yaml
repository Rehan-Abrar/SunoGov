services:
  - type: web
    name: sunogov-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MODELSCOPE_API_KEY
        sync: false
      - key: QWEN_MODEL_NAME
        value: "Qwen-Ambassador/Qwen3.7-Plus"
      - key: QWEN_BASE_URL
        value: "https://api-inference.modelscope.ai/v1"
    healthCheckPath: /health
